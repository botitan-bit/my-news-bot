name: Daily Telegram Post

on:
  schedule:
    # 👇 ИЗМЕНЕНО НА КАЖДЫЕ 2 ЧАСА (12 раз в сутки)
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the bot script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
        run: python main.py

      - name: Commit and push state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_theme.txt posted_news.txt
          git commit -m "Update bot state [skip ci]" || echo "No changes to commit"
          
          # Синхронизация перед пушем
          git pull --rebase origin main || true
          
          # 3 попытки пуша
          for i in 1 2 3; do
            if git push; then
              echo "Push successful"
              break
            else
              echo "Push attempt $i failed, retrying..."
              git pull --rebase origin main || true
              sleep 3
            fi
          done
