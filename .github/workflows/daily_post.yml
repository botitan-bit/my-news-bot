name: Daily Telegram Post

# Когда запускать? (Триггеры)
on:
  schedule:
    # Это расписание. Запуск каждый день в 09:30 UTC (всемирное время)
    # Время можно менять. Например, '0 6 * * *' — это 06:00 UTC.
    - cron: '30 9 * * *'
  # Кнопка для ручного запуска (чтобы вы могли проверить работу, не дожидаясь утра)
  workflow_dispatch:
  # Запускать также при каждом сохранении изменений в ветке main
  push:
    branches: [ main ]

# Что делать? (Задача)
jobs:
  post:
    # Использовать виртуальную машину от GitHub (бесплатно)
    runs-on: ubuntu-latest
    steps:
      # 1. Скачать ваш код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Установить Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Установить библиотеки из файла requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запустить ваш скрипт, передав ему «ключи» из сейфа (Secrets)
      - name: Run the bot script
        env:
          # Имена этих переменных должны точно совпадать с тем, что вы создали в Secrets
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }} # Если вы назвали секрет GOOGLE_API_KEY, то пишите так. Если GEMINI_API_KEY — поменяйте здесь.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        # Запускаем файл main.py, который лежит в корне
        run: python main.py
